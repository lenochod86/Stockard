name: Release

# Postaví Android APK a připojí ho k GitHub Release.
#   git tag v1.0.0 && git push origin v1.0.0
# Nebo ručně: Actions → Release → Run workflow → vyplnit verzi (např. 1.0.0).
# Tag vV.V.V si pak GitHub vytvoří sám na zvoleném commitu.
# Bez zadané verze vznikne jen artefakt ke stažení (bez Release).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Verze vydání, např. 1.0.0 (prázdné = jen sestavit, bez Release)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Určit tag vydání
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          elif [[ -n "$INPUT_VERSION" ]]; then
            TAG="v${INPUT_VERSION#v}"
          else
            TAG=""
          fi
          if [[ -n "$TAG" && ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Neplatná verze '$TAG' (čekám např. 1.0.0)" >&2; exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" != "tag" && -n "$TAG" ]] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG už existuje." >&2; exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Verze (z tagu) a versionCode (z čísla běhu)
        run: |
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync("app.json", "utf8"));
            c.expo.version = process.env.V.replace(/^v/, "").split("-")[0];
            c.expo.android.versionCode = Number(process.env.N);
            fs.writeFileSync("app.json", JSON.stringify(c, null, 2));
          '
        env:
          V: ${{ env.TAG || 'v0.0.0' }}
          N: ${{ github.run_number }}

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Vygenerovat nativní projekt
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'

      - name: Sestavit APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Přejmenovat APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Stockard-${TAG:-dev-$GITHUB_RUN_NUMBER}.apk"
          ls -lh Stockard-*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: Stockard-android
          path: Stockard-*.apk

      - name: Vytvořit GitHub Release
        if: env.TAG != ''
        run: gh release create "$TAG" Stockard-*.apk --target "$GITHUB_SHA" --title "Stockard $TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
